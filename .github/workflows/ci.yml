name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -timeout 5m -race -count=1 ./...

      - name: Build binaries
        run: |
          go build -o /dev/null ./cmd/goed2k
          go build -o /dev/null ./cmd/goed2k-web

      - name: Build examples
        run: |
          go build -o /dev/null ./examples/...
